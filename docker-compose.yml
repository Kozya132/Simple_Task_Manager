name: todo-tracker

x-app: &app
  image: todo-tracker-api:local
  build: .
  env_file: .env
  environment:
    TODO_TRACKER_DATABASE_URL: postgresql+asyncpg://${TODO_TRACKER_POSTGRES_USER:?Run python3 scripts/init_env.py}:${TODO_TRACKER_POSTGRES_PASSWORD:?Run python3 scripts/init_env.py}@postgres:5432/${TODO_TRACKER_POSTGRES_DB:?Run python3 scripts/init_env.py}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TODO_TRACKER_POSTGRES_USER:?Run python3 scripts/init_env.py}
      POSTGRES_PASSWORD: ${TODO_TRACKER_POSTGRES_PASSWORD:?Run python3 scripts/init_env.py}
      POSTGRES_DB: ${TODO_TRACKER_POSTGRES_DB:?Run python3 scripts/init_env.py}
    ports:
      - "127.0.0.1:${TODO_TRACKER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${TODO_TRACKER_API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
